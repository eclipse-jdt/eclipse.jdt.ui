name: Bug 569992 upstream verification

on:
  push:
    branches:
      - fix/569992-test-execution-timing

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify with tests
        run: >-
          xvfb-run -a mvn -U -e -DskipTests=false
          clean verify --batch-mode --fail-at-end
          -Pbree-libs -Papi-check -Pjavadoc -Pbuild-individual-bundles
          -Dcompare-version-with-baselines.skip=false
